name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.check_name }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_name: ubuntu-latest
          - os: windows-2022
            check_name: windows-latest
          - os: macos-15
            check_name: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI helpers
        run: python -m unittest discover -s tests/ci -v
      - name: Lint GitHub Actions workflows
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Install TeX Live, Pygments and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-chinese python3-pygments \
            fonts-firacode fonts-noto-cjk
          fc-cache -f
          command -v xelatex
          command -v pygmentize
          test -n "$(kpsewhich ctexart.cls)"
      - name: Build and test
        run: dotnet test template_builder.sln --configuration Release -p:ContinuousIntegrationBuild=true --verbosity minimal --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Require real PDF tests to execute on Linux
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('TestResults/tests.trx').getroot()
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters = root.find('t:ResultSummary/t:Counters', ns).attrib
          if int(counters['total']) == 0 or counters['executed'] != counters['total']:
              raise SystemExit(f"Linux tests must all execute: {counters}")
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 14

  publish:
    # Packaging is a PR gate too; only release-assets writes to a GitHub release.
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
          - os: windows-2022
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve application version
        shell: bash
        run: |
          VERSION=$(python scripts/ci.py version)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Publish self-contained binaries
        shell: bash
        run: |
          dotnet publish template_builder.csproj --configuration Release \
            --runtime '${{ matrix.runtime }}' --self-contained true \
            -p:Version="$APP_VERSION" -p:ContinuousIntegrationBuild=true \
            --output 'publish/template_builder-${{ matrix.runtime }}'
      - name: Archive and checksum
        run: python scripts/ci.py package ${{ matrix.runtime }}
      - name: Verify checksum, unpack and run native CLI smoke
        shell: bash
        run: python scripts/ci.py verify '${{ matrix.runtime }}' --version "$APP_VERSION"
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            publish/*.tar.gz
            publish/*.zip
            publish/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-${{ matrix.runtime }}
          path: publish/verify_smoke
          include-hidden-files: true
          retention-days: 14

  docker:
    needs: test
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      PUSH_IMAGE: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve application version and image name
        run: |
          VERSION=$(python3 scripts/ci.py version)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify PDF and export native image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH_IMAGE }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Export image digest
        if: env.PUSH_IMAGE == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p temp/digests
          touch "temp/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: env.PUSH_IMAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: temp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    # A package failure may block a Release, but must not block a verified dev image.
    needs: [docker, publish]
    if: >-
      !cancelled() && needs.docker.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Publish multi-platform manifest
        env:
          DOCKER_METADATA_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_JSON")
          ARGS=()
          for TAG in "${TAGS[@]}"; do ARGS+=(--tag "$TAG"); done
          SOURCES=()
          for DIGEST in /tmp/digests/*; do SOURCES+=("$IMAGE@sha256:$(basename "$DIGEST")"); done
          test "${#SOURCES[@]}" -eq 2
          docker buildx imagetools create "${ARGS[@]}" "${SOURCES[@]}"
          docker buildx imagetools inspect "${TAGS[0]}"

  release-assets:
    needs: [publish, docker-publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: publish
          merge-multiple: true
      - name: Upload all verified assets together
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            publish/*.tar.gz
            publish/*.zip
            publish/*.sha256
